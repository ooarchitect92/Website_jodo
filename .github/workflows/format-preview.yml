name: Format preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - name: Show Prettier diff
        run: |
          npx prettier --write             apps/api/src/fees.ts             apps/web/src/components/admin/fees.tsx             packages/core/src/contracts.ts             tests/integration/platform.test.ts             tests/unit/core.test.ts
          git diff --             apps/api/src/fees.ts             apps/web/src/components/admin/fees.tsx             packages/core/src/contracts.ts             tests/integration/platform.test.ts             tests/unit/core.test.ts
