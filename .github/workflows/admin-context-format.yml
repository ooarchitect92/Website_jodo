name: One-time admin context format repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-context-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - name: Format the single CI-reported file
        run: |
          npx prettier --write apps/web/src/components/admin/context.tsx
          npx prettier --check apps/web/src/components/admin/context.tsx
      - name: Commit scoped formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/src/components/admin/context.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(web): apply canonical Prettier formatting to admin context'
            git push origin HEAD:main
          fi
