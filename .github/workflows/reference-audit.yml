name: Reference audit
on:
  push:
    paths:
      - '.github/workflows/reference-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public reference without submitting forms
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/jodo-audit"
          cd "$RUNNER_TEMP/jodo-audit"
          npm init -y >/dev/null
          npm install playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir evidence
          cat > inspect.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const routes = ['/', '/products/', '/contact-us/', '/about-us/', '/tools/hidden-cost-calculator/', '/blog/', '/case-studies/'];
            const records = [];
            for (let i = 0; i < routes.length; i++) {
              try {
                const response = await page.goto('https://www.jodo.in' + routes[i], { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(2000);
                await page.screenshot({ path: `evidence/reference-${i}.png`, fullPage: true });
                records.push(await page.evaluate(({ path, status }) => ({
                  path, status, title: document.title,
                  headings: [...document.querySelectorAll('h1,h2')].map(x => x.textContent.trim()),
                  styles: [...document.querySelectorAll('body, header, nav, h1, h2, .hero, a, button')].slice(0, 40).map(x => {
                    const s = getComputedStyle(x);
                    return { tag: x.tagName, class: x.className, color:s.color, background:s.backgroundColor, font:s.fontFamily, size:s.fontSize, weight:s.fontWeight, radius:s.borderRadius };
                  }),
                  links:[...document.querySelectorAll('a[href]')].map(x => ({label:x.innerText.trim(),href:x.href})).filter(x=>x.label),
                  assets:[...document.images].map(x=>({src:x.currentSrc||x.src,alt:x.alt,width:x.width,height:x.height}))
                }), {path:routes[i],status:response.status()}));
              } catch (error) { records.push({path:routes[i],error:String(error)}); }
            }
            await page.setViewportSize({width:390,height:844});
            await page.goto('https://www.jodo.in/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1500);
            await page.screenshot({path:'evidence/reference-mobile.png',fullPage:true});
            fs.writeFileSync('evidence/reference.json',JSON.stringify(records,null,2));
            const packages=['next','react','react-dom','@nestjs/core','@nestjs/common','@nestjs/platform-express','@nestjs/swagger','@nestjs/throttler','@prisma/client','prisma','zod','typescript','tailwindcss','@tailwindcss/postcss','pg','argon2','otplib','helmet','cookie-parser','class-validator','class-transformer','rxjs','reflect-metadata','tsx','vitest','@playwright/test','@axe-core/playwright'];
            const versions={};
            for(const name of packages){ const result=await fetch('https://registry.npmjs.org/'+encodeURIComponent(name)+'/latest').then(r=>r.json()); versions[name]={version:result.version,engines:result.engines}; }
            fs.writeFileSync('evidence/package-versions.json',JSON.stringify(versions,null,2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jodo-reference-audit
          path: ${{ runner.temp }}/jodo-audit/evidence
          retention-days: 7
