name: Academic backend format preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - name: Show Prettier diff
        run: |
          npx prettier --write apps/api/src/academic.ts
          git diff -- apps/api/src/academic.ts
