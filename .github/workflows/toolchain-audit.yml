name: Toolchain security update
on:
  push:
    paths: ['.github/workflows/toolchain-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed security updates and freeze all versions
        run: |
          npm install --no-fund
          npm install --save-exact sharp@0.35.5 nodemailer@10.0.15 --no-fund
          node <<'JS'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          for(const group of ['dependencies','devDependencies']) for(const name of Object.keys(p[group])) p[group][name]=JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json','utf8')).version;
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          npm install --package-lock-only --no-fund
          npm audit --omit=dev --json > dependency-audit.json || true
          mkdir artifacts
          tar -czf artifacts/jodo-security-toolchain.tar.gz node_modules package.json package-lock.json dependency-audit.json
          cp package.json package-lock.json dependency-audit.json artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jodo-security-toolchain
          path: artifacts/
          compression-level: 0
          retention-days: 3
