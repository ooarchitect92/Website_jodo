name: Repair known formatting drift
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - name: Format only the ten files listed by failed CI
        run: |
          npx prettier --write \
            apps/api/src/payment-provider.ts \
            'apps/web/src/app/(public)/[[...slug]]/page.tsx' \
            docs/implementation/production-gap-plan.md \
            packages/core/src/mandate-events.ts \
            scripts/production-gate.mjs \
            tests/unit/mandate-ordering.test.ts \
            tests/unit/payment-provider-webhook.test.ts \
            tests/unit/production-gate.test.mjs \
            tests/unit/rejected-success-checkout.test.ts \
            tests/unit/tenant-route-role.test.ts
          npx prettier --check .
      - name: Push reviewed scope to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/api/src/payment-provider.ts \
            'apps/web/src/app/(public)/[[...slug]]/page.tsx' \
            docs/implementation/production-gap-plan.md \
            packages/core/src/mandate-events.ts \
            scripts/production-gate.mjs \
            tests/unit/mandate-ordering.test.ts \
            tests/unit/payment-provider-webhook.test.ts \
            tests/unit/production-gate.test.mjs \
            tests/unit/rejected-success-checkout.test.ts \
            tests/unit/tenant-route-role.test.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required'
          else
            git commit -m 'style: repair ten CI-reported formatting issues'
            git push origin HEAD:main
          fi
