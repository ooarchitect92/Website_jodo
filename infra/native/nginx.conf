# Install behind an operator-managed TLS endpoint. Replace server_name and provision TLS.
# Only $uri is logged: queries may contain campaign parameters or sensitive tokens.
log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/website-jodo.log safe;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
